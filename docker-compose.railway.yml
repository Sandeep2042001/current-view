version: '3.8'

services:
  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Railway Database Connection
      - DB_HOST=${RAILWAY_DB_HOST}
      - DB_PORT=${RAILWAY_DB_PORT}
      - DB_NAME=${RAILWAY_DB_NAME}
      - DB_USER=${RAILWAY_DB_USER}
      - DB_PASSWORD=${RAILWAY_DB_PASSWORD}
      # Keep local services
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    depends_on:
      - redis
      - minio
    networks:
      - app-network

  # Redis for caching and job queues
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  # CV Worker
  cv-worker:
    build:
      context: ./cv-pipeline
      dockerfile: Dockerfile.fast
    environment:
      - NODE_ENV=production
      # Railway Database Connection
      - DB_HOST=${RAILWAY_DB_HOST}
      - DB_PORT=${RAILWAY_DB_PORT}
      - DB_NAME=${RAILWAY_DB_NAME}
      - DB_USER=${RAILWAY_DB_USER}
      - DB_PASSWORD=${RAILWAY_DB_PASSWORD}
      # Keep local services
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    depends_on:
      - redis
      - minio
    volumes:
      - cv-temp:/app/temp
    networks:
      - app-network

volumes:
  redis_data:
  minio_data:
  cv-temp:

networks:
  app-network:
    driver: bridge
